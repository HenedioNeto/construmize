
services:
  postgres:
    image: postgres:17
    container_name: construmize-postgres
    environment:
      POSTGRES_DB: construmize
      POSTGRES_USER: construmize
      POSTGRES_PASSWORD: construmize_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U construmize -d construmize"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
