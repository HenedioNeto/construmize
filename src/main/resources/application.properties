spring.application.name=construmize

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/construmize}
spring.datasource.username=${DB_USERNAME:construmize}
spring.datasource.password=${DB_PASSWORD:construmize_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

server.port=8080